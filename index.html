<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ملتقى أشبال الزهراء</title>

  <style>
    @font-face {
      font-family: 'Noor';
      src: url('Noor.ttf');
    }

    :root {
      --main-color: #ebaf41;
    }

    body {
      margin: 0;
      font-family: 'Noor', sans-serif;
      background: #0b0b0b;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      color: var(--main-color);
      margin-bottom: 10px;
      font-size: 28px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      margin: 10px 0;
      text-align: center;
      box-sizing: border-box;
      font-family: 'Noor', sans-serif;
    }

    button {
      padding: 12px 20px;
      margin: 10px 5px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Noor', sans-serif;
    }

    .download {
      background: var(--main-color);
      color: #fff;
    }

    .clear {
      background: #333;
      color: #fff;
    }

    canvas {
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>ملتقى أشبال الزهراء</h2>

    <input
      type="text"
      id="nameInput"
      placeholder="اكتب الاسم هنا"
      autocomplete="off"
    >

    <div>
      <button class="clear" onclick="clearName()">مسح</button>
      <button class="download" onclick="downloadImage()">تحميل الصورة</button>
    </div>

    <canvas id="canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const nameInput = document.getElementById("nameInput");

    const config = {
      image: "ashbal-alzahra.jpg",
      color: "#ebaf41",
      box: {
        x: 0.32,
        y: 0.36,
        width: 0.64,
        height: 0.06
      }
    };

    const img = new Image();
    img.src = config.image;

    img.onload = function () {
      canvas.width = img.width;
      canvas.height = img.height;
      draw();
    };

    img.onerror = function () {
      alert("الصورة غير موجودة أو اسمها غير مطابق: " + config.image);
    };

    nameInput.addEventListener("input", draw);

    function fitText(text, maxWidth) {
      let size = 90;
      do {
        ctx.font = size + "px Noor";
        size--;
      } while (ctx.measureText(text).width > maxWidth && size > 20);
      return size;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const name = nameInput.value.trim();
      if (!name) return;

      const box = {
        x: canvas.width * config.box.x,
        y: canvas.height * config.box.y,
        width: canvas.width * config.box.width,
        height: canvas.height * config.box.height
      };

      const fontSize = fitText(name, box.width * 0.9);

      ctx.fillStyle = config.color;
      ctx.direction = "rtl";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.font = fontSize + "px Noor";

      const textX = box.x + box.width;
      const textY = box.y + box.height / 2;

      ctx.fillText(name, textX, textY);
    }

    function downloadImage() {
      const name = nameInput.value.trim() || "ashbal-alzahra";
      const link = document.createElement("a");
      link.download = name + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function clearName() {
      nameInput.value = "";
      draw();
      nameInput.focus();
    }
  </script>

</body>
</html>
